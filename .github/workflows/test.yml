name: Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha test file(s) to run instead of the full suite"
        required: false
        default: ""

env:
  FORCE_COLOR: 2
  NPM_CONFIG_REGISTRY: https://:2026-03-23T20%3A39%3A08.118000Z@time-machines-npm.sealsecurity.io/

jobs:
  run:
    name: Node.js ${{ matrix.node }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node: [24, 8.6, 10, 12, 14, 16]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: x64

      - name: Drop unused git-hosted devDependency
        shell: bash
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.devDependencies['time-require'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install npm dependencies
        run: npm install

      - name: Pin Node 8 compatible istanbul-lib-report
        # istanbul-lib-report 3.0.1 depends on make-dir 4 (Node >= 10, `catch {`)
        if: matrix.node == 8.6
        shell: bash
        run: npm install --no-save istanbul-lib-report@3.0.0

      - name: Run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx nyc mocha --reporter dot ${{ inputs.test-filter }}
          else
            npm run test:ci
          fi

      - name: Run Coveralls
        # `master` should be a tag but they don't have one
        uses: coverallsapp/github-action@master
        if: false
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Pack
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == 24
        shell: bash
        run: |
          git checkout -- package.json
          npm pack

      - name: Upload package tarball
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: picomatch-tgz
          path: picomatch-*.tgz
          if-no-files-found: error
